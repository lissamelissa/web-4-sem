{% extends 'base.html' %}
{% block title %}{% if mode == 'edit' %}Редактировать задачу{% else %}Новая задача{% endif %}{% endblock %}
{% block content %}
    <div class="nav-top">
        <a href="{% url 'dashboard' user_id=current_user.id %}">← Дашборд</a>
    </div>
    <div class="card">
        <h2>{% if mode == 'edit' %}Редактировать задачу{% else %}Новая задача{% endif %}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Сохранить</button>
        </form>
    </div>
{% endblock %}
