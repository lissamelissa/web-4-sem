<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planify{% endblock %}</title>
    <style>
        :root {
            --bg: #161414;
            --card: #242021;
            --card-border: #372f2f;
            --accent: #a05a5a;
            --accent-hover: #b96f6f;
            --text: #f0e6e2;
            --text-dim: #b3a6a2;
            --danger: #8b3a3a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 60px;
        }
        .container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        h1, h2, h3 { margin: 0 0 12px; }
        a { color: var(--accent-hover); }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 9px 16px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent-hover); }
        .form-input, .form-textarea, .form-select,
        input[type=text], input[type=password], input[type=email],
        input[type=date], input[type=number], select, textarea {
            width: 100%;
            background: #1c1919;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text);
            margin-bottom: 12px;
            font-size: 14px;
        }
        label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
        .task-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border); gap: 10px; }
        .task-row:last-child { border-bottom: none; }
        .progress-bar { background: #1c1919; border-radius: 6px; height: 8px; overflow: hidden; margin: 6px 0; }
        .progress-bar-fill { background: var(--accent); height: 100%; }
        .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: var(--card); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 14px; gap: 10px; }
        .tag { color: var(--text-dim); font-size: 12px; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}<li>{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
